name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: pnpm kur
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: GitHub Pages yapılandırmasını hazırla
        uses: actions/configure-pages@v5

      - name: Bağımlılıkları kur
        run: pnpm install --frozen-lockfile

      - name: Build ve yayın dosyalarını doğrula
        run: pnpm test

      - name: Kaynak ve artifact content.json eşitliğini doğrula
        shell: bash
        run: |
          cmp --silent content.json dist/content.json
          sha256sum content.json dist/content.json

      - name: Yalnızca dist klasörünü yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
