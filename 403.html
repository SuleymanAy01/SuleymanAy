<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#060910" />
    <title>403 — Erişim Reddedildi</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 10%, rgba(37, 112, 239, 0.24), transparent 34%),
          #060910;
        color: #f5f8fd;
      }
      main {
        width: min(100%, 520px);
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 28px;
        background: rgba(13, 20, 34, 0.78);
        box-shadow: 0 40px 100px rgba(0, 0, 0, 0.42);
        text-align: center;
        backdrop-filter: blur(24px);
      }
      strong { color: #4d92ff; font-size: 78px; letter-spacing: -0.08em; }
      h1 { margin: 12px 0; font-size: 30px; letter-spacing: -0.04em; }
      p { margin: 0 auto 28px; color: #9aa8bc; line-height: 1.7; }
      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        padding: 0 18px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3784f8, #1a62cf);
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <strong>403</strong>
      <h1>Erişim Reddedildi</h1>
      <p>Bu yönetim paneli yalnızca yetkilendirilmiş GitHub hesabı tarafından kullanılabilir.</p>
      <a href="./">Ana sayfaya dön</a>
    </main>
  </body>
